<svg width="100%" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E4E">
        <animate attributeName="stop-color" values="#4A0E4E;#7B2CBF;#1A5B2E;#4A0E4E" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7B2CBF">
        <animate attributeName="stop-color" values="#7B2CBF;#1A5B2E;#4A0E4E;#7B2CBF" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00FF7F">
        <animate attributeName="stop-color" values="#00FF7F;#4A0E4E;#7B2CBF;#00FF7F" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Star definition for background -->
    <g id="star">
      <circle cx="0" cy="0" r="1.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad)" />

  <!-- Stars / Particles -->
  <use href="#star" x="100" y="50" style="animation-delay: 0s" />
  <use href="#star" x="700" y="80" style="animation-delay: 1s" />
  <use href="#star" x="300" y="250" style="animation-delay: 2s" />
  <use href="#star" x="500" y="40" style="animation-delay: 0.5s" />
  <use href="#star" x="150" y="200" style="animation-delay: 1.5s" />
  <use href="#star" x="650" y="220" style="animation-delay: 2.5s" />

  <!-- Glowing effect behind text -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Texts -->
  <text x="50%" y="45%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="55" fill="#ffffff" text-anchor="middle" filter="url(#glow)" letter-spacing="2">
    Juan David Garcia
  </text>
  <text x="50%" y="62%" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#E0FFED" text-anchor="middle" letter-spacing="1">
    Full Stack Developer | AI Solutions Engineer
  </text>

  <!-- Flying GitHub Icon -->
  <g fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="12s" repeatCount="indefinite">
      <mpath href="#flightPath"/>
    </animateMotion>
    
    <!-- Bobbing animation -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-5; 0,5; 0,-5" dur="2s" repeatCount="indefinite"/>
      <svg x="-25" y="-25" width="50" height="50" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </g>
  </g>

  <!-- Flight Path -->
  <path id="flightPath" fill="none" stroke="none" d="M -100 200 C 100 50, 400 350, 600 100 S 900 200, 900 200" />
</svg>
